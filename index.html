<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app-theme');
          var theme = null;
          if (raw === 'light' || raw === 'dark') theme = raw;
          else if (raw && raw.charAt(0) === '"') {
            var u = raw.slice(1, -1);
            if (u === 'light' || u === 'dark') theme = u;
          }
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          var shape = localStorage.getItem('app-shape');
          if (shape) document.documentElement.setAttribute('data-shape', shape);
          document.documentElement.setAttribute('data-skin', 'vscode');
          var vsTheme = localStorage.getItem('app-vscode-theme') || 'dark-modern';
          document.documentElement.setAttribute('data-vscode-theme', vsTheme);
        } catch (_) {}
      })();
    </script>

    <title>Keystorm</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
